# The CollieAi guardrail for the LiteLLM proxy — a package the LiteLLM operator installs into the proxy's environment.
# LiteLLM is the host, not a dependency: the adapter runs inside the operator's LiteLLM (1.102.4 is the release the
# adapter is built and tested against).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collieai-litellm-guardrail"
dynamic = ["version"]
description = "CollieAi guardrail for the LiteLLM proxy: checks every chat completion against your CollieAi policy, observing it or blocking what the policy blocks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CollieAi", email = "sdk@collieai.io" }]
keywords = ["litellm", "guardrails", "ai-guardrails", "llm-security", "llm-firewall", "llm-gateway", "monitoring"]
# No license classifier: the SPDX `license` expression above is the license field (PEP 639).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://collieai.io/?utm_source=pypi&utm_medium=package&utm_campaign=litellm-guardrail"
Documentation = "https://docs.collieai.io/integrations/litellm?utm_source=pypi&utm_medium=package&utm_campaign=litellm-guardrail"
Repository = "https://github.com/CollieAi/collieai-litellm-guardrail"
Issues = "https://github.com/CollieAi/collieai-litellm-guardrail/issues"
Changelog = "https://github.com/CollieAi/collieai-litellm-guardrail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# LiteLLM itself is not here: the tests of the glue need it, installed next to these (CONTRIBUTING.md).
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16", "mypy>=1.20"]

# Single-source the version: `collieai_guardrail.__version__` is the only place it lives (the request's client
# version reads it at runtime; the build reads it here).
[tool.hatch.version]
path = "collieai_guardrail/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["collieai_guardrail"]

[tool.hatch.build.targets.sdist]
include = ["collieai_guardrail", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "PGH004", "RUF100"]

[tool.ruff.lint.isort]
# the tests' shared helpers sit beside them, on the path their conftest gives (tests/conftest.py)
known-first-party = ["collieai_guardrail", "litellm_contract"]

[tool.mypy]
strict = true
warn_unreachable = true
